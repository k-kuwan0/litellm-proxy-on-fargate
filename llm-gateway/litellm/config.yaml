general_settings:
  store_model_in_db: true
  supported_db_objects:
    - models
    - guardrails
    - mcp
    - prompts
  proxy_batch_write_at: 60
  database_connection_pool_limit: 10
  disable_error_logs: True

litellm_settings:
  success_callback: ["s3_v2"]
  s3_callback_params:
    s3_bucket_name: os.environ/S3_LOG_BUCKET_NAME
    s3_region_name: os.environ/AWS_DEFAULT_REGION
    s3_path: request_logs/
    s3_use_team_prefix: true
    s3_use_key_prefix: true
  request_timeout: 600
  set_verbose: False
  json_logs: true

router_settings:
  routing_strategy: simple-shuffle
